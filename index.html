<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1339">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blutex">
<meta name="description" content="Walk into the Blutex showroom in 3D: tile adhesives, epoxy grout and waterproofing products with data sheets.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

<title>Blutex Virtual Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;600&family=Montserrat:wght@500&display=swap">
<style>
/* Layout: full-screen 3D shop; storefront photo intro; top bar (language, home); salesman speech bubble; bottom product strip + slide-up product sheet */
:root{
  --navy:#0f1339; --navy-d:#0b0e2b; --panel:rgba(15,19,57,.95); --line:#2a3170;
  --blue:#1e90ff; --gold:#f5a623; --ink:#ffffff; --mute:#a7b8d6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Noto Sans Malayalam",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--navy-d);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
body.ml{--body:"Noto Sans Malayalam","Barlow",system-ui,sans-serif}
#app{position:fixed;inset:0}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 60%,rgba(0,0,0,.28) 100%)}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* intro */
#intro{position:fixed;inset:0;z-index:20;background:transparent;display:flex;flex-direction:column;justify-content:flex-end}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,19,57,0) 0%,rgba(15,19,57,0) 44%,rgba(15,19,57,.97) 70%)}
.intro-in{position:relative;padding:24px 16px calc(28px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;width:100%;box-sizing:border-box;display:grid;gap:14px;text-align:center}
.intro-in .eb{font-family:var(--display);letter-spacing:.2em;color:var(--gold);font-size:14px;text-transform:uppercase}
.intro-in h1{font-family:var(--display);font-size:clamp(34px,9vw,52px);margin:0;line-height:1}
.intro-in p{margin:0;color:var(--mute)}
.brands{display:grid;gap:5px}
.intro-in{gap:10px!important}
.brands-h{font-family:var(--display);letter-spacing:.24em;font-size:12px;color:var(--gold);text-transform:uppercase}
.brands-row{overflow:hidden;position:relative;contain:paint}
.brands-row::before,.brands-row::after{content:"";position:absolute;top:0;bottom:0;width:14%;z-index:1;pointer-events:none}
.brands-row::before{left:0;background:linear-gradient(90deg,#0f1339,rgba(15,19,57,0))}
.brands-row::after{right:0;background:linear-gradient(270deg,#0f1339,rgba(15,19,57,0))}
.brands-track{display:flex;width:max-content;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;animation:brands 26s linear infinite}
.brands-track span{flex:none;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;color:#fff;padding:4px 12px;margin-right:8px;border:1px solid rgba(244,193,66,.55);border-radius:999px;background:rgba(15,19,57,.55);white-space:nowrap}
@keyframes brands{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
@media (prefers-reduced-motion:reduce){.brands-track{animation:none;flex-wrap:wrap;width:auto;justify-content:center}.brands-track span[aria-hidden]{display:none}}
.lang{display:flex;justify-content:center;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:max-content;margin:0 auto;background:rgba(15,19,57,.6)}
.lang button{background:transparent;border:0;padding:8px 18px;font-size:15px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}
.enter{background:var(--blue);border:0;border-radius:14px;padding:16px;font-weight:600;font-size:18px;color:#fff;box-shadow:0 8px 24px rgba(30,144,255,.35)}
.loading{font-size:13px;color:var(--mute);min-height:1.2em}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(180deg,rgba(15,19,57,.85),transparent)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em}
.brand span{color:var(--blue)}
.tb{display:flex;gap:8px;align-items:center}
.icon{background:rgba(15,19,57,.7);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:14px;white-space:nowrap}
[hidden]{display:none!important}
#top .lang button{padding:7px 11px;font-size:14px}
@media (max-width:460px){#top .brand{font-size:18px}.tb{gap:5px}.icon{padding:6px 9px;font-size:13px}#top .lang button{padding:6px 9px;font-size:13px}}
@media (max-width:380px){#top .brand{display:none}}

/* speech bubble */
#bubble{position:fixed;z-index:6;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top,0px));max-width:520px;margin:0 auto;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;
  transition:opacity .3s,transform .3s}
#bubble.off{opacity:0;transform:translateY(-8px);pointer-events:none}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(160deg,#2a5bd7,#0b1f4b);display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:18px;border:2px solid var(--blue)}
.bt{min-width:0}
.bt b{font-size:13px;color:var(--gold);display:block}
.bt p{margin:2px 0 0;font-size:15px;line-height:1.45}
.vnote{font-size:12px;color:var(--mute);margin-top:4px}
/* while a product/project panel is open the full text is in the panel: keep Tex's bubble to 2 lines (tap to expand) */
body.sheet-open #say{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
body.sheet-open #bubble{cursor:pointer}
@media (min-width:900px){body.sheet-open #bubble{left:16px;right:452px;margin:0;max-width:none}}
body.sheet-open #bubble.full{z-index:8;max-height:60vh;overflow:auto}
body.sheet-open #bubble.full #say{display:block;-webkit-line-clamp:unset}

/* hint */
#hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:rgba(15,19,57,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mute);white-space:nowrap;transition:opacity .4s}

/* product strip */
#strip{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(15,19,57,.95) 60%,transparent);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:rgba(15,19,57,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:118px;text-align:left}
.chip small{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.chip span{font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{border-color:var(--blue);background:#1d2463}
.chip.wp small{color:#6fc1ff}.chip.ta small{color:var(--gold)}

/* product sheet */
#sheet{position:fixed;z-index:7;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh{max-width:620px;margin:0 auto;display:grid;gap:12px}
.sh-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.sh h2{font-family:var(--display);font-size:32px;margin:2px 0 0;line-height:1}
.x{background:transparent;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;flex:none;font-size:18px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;border-radius:6px;padding:3px 8px;background:#0e4a5c}
.badge.sample{background:#5a3b06;color:#ffd38a}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font-family:var(--display);font-size:34px;color:var(--gold)}
.price span{font-size:13px;color:var(--mute)}
.pimg{width:min(46%,200px);height:auto;border-radius:10px;justify-self:center}
.desc{margin:0;line-height:1.55;font-size:15px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#1d2463;border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink)}
.btn.wa{background:#1f9d55;border-color:#1f9d55}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;width:40%;padding-right:10px}
.dsh{font-family:var(--display);font-size:20px;margin:6px 0 0;letter-spacing:.04em}
@media (min-width:900px){#sheet{left:auto;right:16px;bottom:16px;width:420px;max-height:calc(100% - 120px);border-radius:20px;border:1px solid var(--line)}#strip{justify-content:center}}
@media (prefers-reduced-motion:reduce){#sheet,#bubble{transition:none}}

#projbtn{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#1a1300;border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap}
#hint{bottom:calc(140px + env(safe-area-inset-bottom,0px))!important}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.pcard{display:grid;gap:3px;text-align:left;background:#161b4a;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}
.pcard b{font-size:15px}.pcard span{font-size:12px;color:var(--mute)}
.pcard:hover,.pcard:focus-visible{border-color:var(--gold)}
.parea{display:grid;gap:6px;font-size:13px;color:var(--mute)}
.prow{display:flex;gap:8px}
.prow input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:#0b0e2b;color:var(--ink);padding:0 12px;font:16px var(--body)}
.punit{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.punit button{background:transparent;border:0;color:var(--mute);padding:0 12px;font-size:14px}
.punit button[aria-pressed="true"]{background:#1e4fb0;color:#fff}
.plist{display:grid;gap:8px}
.prec{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:#121640;border:1px solid var(--line);border-radius:12px;padding:8px}
.prec.main{border-color:var(--gold)}
.prec img,.pimg0{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#fff}
.pt{display:grid;gap:2px;min-width:0}.pt small{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}.pt b{font-size:15px}.pt span{font-size:13px;color:var(--mute)}
.pv{padding:8px 12px;font-size:13px}
.pnote{margin:0;font-size:12px;color:var(--mute)}
.install{justify-self:center;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:9px 18px;font-weight:600;font-size:15px}
.ioshint{font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}

/* ===== BLUTEX Virtual Showroom: landing site, nav, sections ===== */
#intro{display:block!important;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#intro::before{display:none}
.snav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px;margin-bottom:-58px;
  padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));padding-top:env(safe-area-inset-top,0px);transition:background .25s,border-color .25s;border-bottom:1px solid transparent}
.snav.solid{background:rgba(11,14,43,.96);border-bottom-color:rgba(255,255,255,.08)}
.snav-logo img{height:24px;display:block}
.snav-links{display:flex;gap:4px}
.snav-links a{color:#dfe4f5;text-decoration:none;font-family:var(--display);font-weight:600;letter-spacing:.14em;font-size:13px;padding:10px 10px;border-radius:8px}
.snav-links a:hover{color:#fff;background:rgba(255,255,255,.06)}
.snav-menu{display:none;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:10px;width:44px;height:40px;font-size:18px}
@media (max-width:860px){
  .snav-menu{display:block}
  .snav-links{display:none;position:absolute;top:58px;left:0;right:0;flex-direction:column;gap:0;background:#0b0e2b;border-bottom:1px solid rgba(255,255,255,.1);padding:6px 8px 12px}
  .snav.open .snav-links{display:flex}
  .snav.open{background:#0b0e2b}
  .snav-links a{font-size:15px;padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
}
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,19,57,.55) 0,rgba(15,19,57,0) 12%,rgba(15,19,57,0) 36%,rgba(15,19,57,.9) 52%,rgba(15,19,57,.98) 64%);pointer-events:none}
@media (max-width:600px){.intro-in .eb{display:none}.intro-in h1{font-size:clamp(30px,8.6vw,44px)!important}}
.scroll-cue{display:block;text-align:center;color:var(--mute);font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:4px 0 0}
.site{position:relative;background:#0b0e2b;color:#fff}
.sec{padding:60px 16px;border-top:1px solid rgba(255,255,255,.07)}
.sec.alt{background:#0f1339}
.sec-in{max-width:1080px;margin:0 auto}
.kick{font-family:var(--display);letter-spacing:.24em;font-size:12px;color:var(--gold);text-transform:uppercase}
.sec h2{font-family:var(--display);font-size:clamp(28px,5vw,40px);line-height:1.05;margin:8px 0 10px;font-weight:700}
.lead{color:var(--mute);max-width:62ch;margin:0 0 24px;line-height:1.6}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(244,193,66,0));width:72px;margin:10px 0 18px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.scard{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.scard h3{font-family:var(--display);font-size:21px;margin:0;letter-spacing:.02em}
.scard p{margin:0;color:var(--mute);font-size:14px;line-height:1.55}
.scard .n{font-family:var(--display);color:var(--gold);font-size:13px;letter-spacing:.16em}
.pcard2{padding:0;overflow:hidden}
.pcard2 .ph{background:#fff;height:150px;display:grid;place-items:center}
.pcard2 .ph img{max-height:132px;max-width:86%;object-fit:contain}
.pcard2 .pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard2 .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7fc4ff}
.swatch{display:flex;gap:6px}.swatch i{width:22px;height:46px;border-radius:4px;display:block}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:transparent;border:1px solid rgba(255,255,255,.18);color:#dfe4f5;border-radius:999px;padding:9px 16px;font-size:14px;min-height:40px}
.pill[aria-pressed="true"]{background:#fff;color:#0b0e2b;border-color:#fff}
.sacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.sbtn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.sbtn.pri{background:var(--blue);border-color:var(--blue)}
.sbtn.wa{background:#1f9d55;border-color:#1f9d55}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0;border:1px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden;margin-top:26px}
.trust div{padding:16px 18px;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.trust b{display:block;font-family:var(--display);font-size:20px;letter-spacing:.02em}
.trust span{color:var(--mute);font-size:13px}
.tds{display:grid;gap:8px}
.tdsrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.02)}
.tdsrow b{font-size:15px}.tdsrow small{display:block;color:var(--mute);font-size:12px}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.contact a,.contact div{color:#fff;text-decoration:none}
.contact .scard b{font-size:16px;word-break:break-word}
.cta{text-align:center;padding:72px 16px;background:radial-gradient(ellipse 70% 90% at 50% 0%,#1a2160,#0b0e2b 70%);border-top:1px solid rgba(255,255,255,.07)}
.cta h2{font-family:var(--display);font-size:clamp(28px,6vw,46px);margin:8px 0 6px}
.cta .sacts{justify-content:center;margin-top:18px}
.foot{padding:22px 16px calc(90px + env(safe-area-inset-bottom,0px));text-align:center;color:#8d97b8;font-size:12px;border-top:1px solid rgba(255,255,255,.07);background:#0b0e2b}
/* floating WhatsApp */
#waFab{position:fixed;z-index:30;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#1f9d55;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35);border:0}
#waFab svg{width:28px;height:28px;fill:#fff}
body.in-showroom #waFab{bottom:calc(132px + env(safe-area-inset-bottom,0px));width:50px;height:50px}
body.sheet-open #waFab{display:none}
/* showroom: categories above the product chips */
#strip{display:block!important;overflow:visible!important}
#strip[hidden]{display:none!important}
.ctabs,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.ctabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.ctabs{margin-bottom:8px}
.ctab{flex:none;background:rgba(15,19,57,.85);border:1px solid rgba(255,255,255,.16);color:#dfe4f5;border-radius:999px;padding:8px 14px;font-size:13px;min-height:38px;white-space:nowrap}
.ctab[aria-pressed="true"]{background:#fff;color:#0b0e2b;border-color:#fff}
@media (min-width:900px){.ctabs,.chips{justify-content:center}}
#projbtn{bottom:calc(132px + env(safe-area-inset-bottom,0px))!important}
#hint{bottom:calc(186px + env(safe-area-inset-bottom,0px))!important}
/* product information panel */
.ipanel{display:grid;gap:10px}
.iblock{border-top:1px solid var(--line);padding-top:10px}
.iblock h4{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.iblock p{margin:0;font-size:15px;line-height:1.55}
.acts .btn{min-height:44px}
</style>

</head>
<body>
<div id="app"><canvas id="c"></canvas></div>

<div id="intro">
  <header class="snav" id="snav">

const PHONE="919400439967";

/* ---------------- state + i18n ---------------- */
let lang="en", soundOn=true, current=null, entered=false;
const $=s=>document.querySelector(s);
const tr=(v)=>typeof v==="object"?v[lang]:v;
function applyLang(){
  document.body.classList.toggle("ml",lang==="ml");
  document.documentElement.lang=lang==="ml"?"ml":"en";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T[lang][el.dataset.t]);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  buildStrip(); if(current) showSheet(current,false);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-lang]"); if(!b) return;
  lang=b.dataset.lang; applyLang();
  if(entered){ if(current) speak(P.find(p=>p.id===current)[lang],current,whoFor(current)); else speak(T[lang].homeSay,"home","arun"); }
});

/* ---------------- speech ---------------- */
let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices(); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
let typeTimer=null;
// Owner's own recorded voice: key -> {lang: file}
const VOICE={greet:{en:'b_greet_en.mp3',ml:'b_greet_ml.mp3'},home:{en:'b_home_en.mp3',ml:'b_home_ml.mp3'},l2:{en:'b_l2_en.mp3',ml:'b_l2_ml.mp3'},l3:{en:'b_l3_en.mp3',ml:'b_l3_ml.mp3'},ep:{en:'b_ep_en.mp3',ml:'b_ep_ml.mp3'},ro:{en:'b_ro_en.mp3',ml:'b_ro_ml.mp3'},jf:{en:'b_jf_en.mp3',ml:'b_jf_ml.mp3'},aq:{en:'b_aq_en.mp3',ml:'b_aq_ml.mp3'},ce:{en:'b_ce_en.mp3',ml:'b_ce_ml.mp3'},tg:{en:'b_tg_en.mp3',ml:'b_tg_ml.mp3'}};
const player=new Audio(); player.preload="auto";
function setSpeaker(w){ const n=T[lang][w==="anjali"?"anjaliName":"arunName"]; const who=document.getElementById("who"); if(who) who.textContent=n;
  const av=document.getElementById("av"); av.textContent=w==="anjali"?"A":"A"; av.style.borderColor=w==="anjali"?"#2ec4b6":"var(--blue)"; av.style.background=w==="anjali"?"linear-gradient(160deg,#14a3b8,#0b1f4b)":"";
  av.textContent="B"; }
function stopAll(){ try{player.pause();}catch(e){} try{speechSynthesis.cancel();}catch(e){} }
let speaker="arun";
function speak(text,key,who="arun",then){
  speaker=who; setSpeaker(who);
  const sayEl=$("#say"); $("#bubble").classList.remove("off");
  clearInterval(typeTimer); let i=0; sayEl.textContent="";
  const chars=[...text];
  typeTimer=setInterval(()=>{ i+=2; sayEl.textContent=chars.slice(0,i).join(""); if(i>=chars.length) clearInterval(typeTimer); },28);
  for(const k in STAFF) STAFF[k].talkUntil=0;
  STAFF[who].talkUntil=performance.now()+Math.min(14000,chars.length*55);
  const vn=$("#vnote"); vn.hidden=true;
  stopAll();
  const rec=key&&VOICE[key]&&VOICE[key][lang];
  if(rec&&soundOn){
    player.src=rec; player.currentTime=0;
    player.onloadedmetadata=()=>{ STAFF[who].talkUntil=performance.now()+player.duration*1000; };
    player.onended=()=>{ STAFF[who].talkUntil=0; if(then&&speaker===who) then(); };
    STAFF[who].talkUntil=performance.now()+27000;
    player.play().catch(()=>{});
    return;
  }
  if(!soundOn||!("speechSynthesis" in window)){ if(then) setTimeout(()=>{if(speaker===who) then();},Math.min(14000,chars.length*55)+600); return; }
  try{
    speechSynthesis.cancel();
    const want=lang==="ml"?"ml":"en-IN";
    let v=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(want.toLowerCase()));
    if(!v&&lang==="en") v=voices.find(v=>v.lang&&v.lang.startsWith("en"));
    if(!v&&lang==="ml"){ vn.textContent=T.ml.noVoice; vn.hidden=false; if(then) setTimeout(()=>{if(speaker===who) then();},Math.min(14000,chars.length*55)+600); return; }
    const u=new SpeechSynthesisUtterance(text); if(v){u.voice=v;u.lang=v.lang;} else u.lang=want; u.rate=lang==="ml"?.95:1; u.pitch=.95;
    if(false){ const fv=voices.find(x=>x.lang&&x.lang.startsWith(lang==="ml"?"ml":"en")&&/female|woman|veena|lekha|heera|priya|neerja|zira|samantha|karen/i.test(x.name)); if(fv){u.voice=fv;u.lang=fv.lang;} }
    u.onend=()=>{ STAFF[who].talkUntil=0; if(then&&speaker===who) then(); };
    speechSynthesis.speak(u);
  }catch(e){}
}
$("#sound").addEventListener("click",e=>{ soundOn=!soundOn; e.currentTarget.textContent=soundOn?"🔊":"🔇"; e.currentTarget.setAttribute("aria-pressed",soundOn); if(!soundOn){ stopAll(); for(const k in STAFF) STAFF[k].talkUntil=0; } });

/* ---------------- UI: strip + sheet ---------------- */
function buildStrip(){
  $("#strip").innerHTML=P.map(p=>`<button type="button" class="chip ${p.cat} ${p.id===current?"on":""}" data-pid="${p.id}"><small>${T[lang][p.cat]}</small><span>${p.short||p.name.replace("Blutex ","")}</span></button>`).join("");
}
$("#strip").addEventListener("click",e=>{const b=e.target.closest("[data-pid]"); if(b) goProduct(b.dataset.pid);});
function showSheet(id,open=true){
  const p=P.find(x=>x.id===id), L=T[lang];
  const rows=Object.entries(p.spec).map(([k,v])=>`<tr><th>${K[k][lang]}</th><td>${tr(v)}</td></tr>`).join("");
  $("#sh").innerHTML=`
   <div class="sh-top"><div><div class="cat" style="color:${p.cat==="wp"?"#6fc1ff":"var(--gold)"}">${L[p.cat]}</div><h2 id="pname">${p.name}</h2></div>
    <button type="button" class="x" id="close" aria-label="Close">✕</button></div>
   <div class="badges">${p.spec.type?`<span class="badge">${tr(p.spec.type)}</span>`:""}${p.sample?`<span class="badge sample">${L.sample}</span>`:""}</div>
   ${p.img?`<img class="pimg" src="${p.img}" alt="${p.name}">`:""}
   <p class="desc">${p[lang]}</p>
   <div class="acts">
    <button type="button" class="btn" id="listen">▶ ${L.listen}</button>
    <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${PHONE}?text=${encodeURIComponent((lang==="ml"?"ഹലോ ബ്ലൂടെക്സ്, എനിക്ക് "+p.name+" വേണം. വിലയും ഡെലിവറിയും അറിയിക്കാമോ?":"Hello Blutex, I am interested in "+p.name+". Please share price and delivery."))}">${L.order}</a>
   </div>
   ${p.pdf?`<a class="btn" href="${p.pdf}" target="_blank" rel="noopener">📄 ${L.ds}${p.pdf.endsWith(".pdf")?" (PDF)":""}</a>`:""}
   <div class="dsh">${L.ds}</div>
   <table>${rows}</table>`;
  $("#close").onclick=()=>goHome();
  $("#listen").onclick=()=>speak(p[lang],p.id,whoFor(p.id));
  if(open) $("#sheet").classList.add("open");
}
$("#home").addEventListener("click",()=>goHome());
$("#out").addEventListener("click",()=>{ current=null; $("#sheet").classList.remove("open"); buildStrip();
  flyTo(new THREE.Vector3(1.6,1.6,-3.4),{y:Math.PI-.12,p:-.03},1800); for(const k in STAFF) Object.assign(STAFF[k],{target:STAFF[k].home.clone(),pointAt:null,face:null}); });

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1f4b);

  const tsT=canvasTex(512,768,(g,w,h)=>{g.fillStyle="#0f1339";g.fillRect(0,0,w,h);g.fillStyle="#f3e2bf";g.font="600 40px 'Barlow Condensed',Arial";g.fillText("TILE SHOWCASE",28,58);

  for(let i=0;i<11;i++){const lf=new THREE.Mesh(new THREE.ConeGeometry(.07,1.1,6),mat({color:0x2f7a4f,roughness:.7}));lf.position.set(-4.3+Math.sin(i*1.7)*.1,.95,-11.2+Math.cos(i*1.7)*.1);lf.rotation.set(Math.sin(i*2.3)*.5,0,Math.cos(i*3.1)*.5);scene.add(lf);}

  // product textures
  const l2T=tex("l2.jpg"), l3T=tex("l3.jpg");

function updateExterior(dt){
  const near=camera.position.z>-2.6&&camera.position.z<6.5;
  doorOpen+=((near?1:0)-doorOpen)*Math.min(1,dt*2.2);
  DOORS.forEach(d=>d.rotation.y=d.userData.sd*doorOpen*1.25);
  CARS.forEach(c=>{c.x+=c.v*dt; if(c.x>26)c.x=-26; if(c.x<-26)c.x=26; c.g.position.x=c.x;});
}

    }
    if(walking){ g.position.add(to.normalize().multiplyScalar(Math.min(dist,1.25*dt))); g.rotation.y+=angDiff(g.rotation.y,Math.atan2(to.x,to.z))*Math.min(1,dt*7); }
    else { const f=S.pointAt?camera.position.clone().lerp(S.pointAt,.35):(S.face||camera.position); const d=f.clone().sub(g.position); g.rotation.y+=angDiff(g.rotation.y,Math.atan2(d.x,d.z))*Math.min(1,dt*3.5); }
    const ph=t*7.5+S.phase, sw=walking?Math.sin(ph):0;
    P2.legL.rotation.x=-sw*.45; P2.legR.rotation.x=sw*.45;
    P2.kneeL.rotation.x=walking?Math.max(0,Math.sin(ph+Math.PI*.5))*.7:0;
    P2.kneeR.rotation.x=walking?Math.max(0,Math.sin(ph-Math.PI*.5))*.7:0;
    const talking=now<S.talkUntil, br=Math.sin(t*1.7+S.phase);
    P2.chest.scale.set(1,1+br*.006,.64*(1+br*.018));
    if(!walking&&S.pointAt){ const local=g.worldToLocal(S.pointAt.clone()); const ang=Math.atan2(local.x,local.z);
      P2.armR.rotation.set(-1.15+Math.sin(t*1.6)*.04,Math.max(-1.1,Math.min(1.1,ang))*.85,-.05); P2.elbowR.rotation.x=-.18; }
    else { P2.armR.rotation.set(walking?sw*.5:Math.sin(t*1.2+S.phase)*.03,0,-.07); P2.elbowR.rotation.x=walking?-.35:-.14; }
    if(walking){ P2.armL.rotation.set(-sw*.5,0,.07); P2.elbowL.rotation.x=-.35; }
    else if(talking){ P2.armL.rotation.set(-.42+Math.sin(t*3.1)*.12,0,.16); P2.elbowL.rotation.x=-1.0+Math.sin(t*4.3)*.22; }
    else { P2.armL.rotation.set(Math.sin(t*1.1+S.phase)*.03,0,.07); P2.elbowL.rotation.x=-.14; }
    P2.head.rotation.x=talking?Math.sin(t*5.5)*.035:Math.sin(t*.7+S.phase)*.02;
    P2.head.rotation.y=(!walking&&!S.pointAt)?Math.sin(t*.45+S.phase)*.18:0;
    P2.mouth.scale.y=talking?1+Math.abs(Math.sin(t*13))*2.6:1;
    if(t>S.blinkAt){ S.blinkAt=t+2.5+Math.random()*3.5; S.blinkEnd=t+.13; }
    const bl=t<(S.blinkEnd||0)?.12:1; P2.eyes.forEach(e=>e.scale.y=bl);
    if(P2.pony) P2.pony.rotation.z=walking?Math.sin(ph*2)*.12:Math.sin(t*1.3)*.03;
    g.position.y=walking?Math.abs(Math.sin(ph))*.018:0;
  }

  pins.forEach((p,i)=>{p.visible=entered&&camera.position.z<0; p.position.y=p.userData.baseY+Math.sin(t*2+i)*.05;});
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

  pApps:"പ്രധാന ഉപയോഗങ്ങൾ",pBen:"പ്രധാന ഗുണങ്ങൾ",pPack:"ലഭ്യമായ പാക്ക്",pCov:"കവറേജ്",pMeth:"പ്രയോഗ രീതി",pTech:"സാങ്കേതിക വിവരങ്ങൾ",pTds:"ടെക്നിക്കൽ ഡാറ്റാ ഷീറ്റ്",pReqTds:"ഡാറ്റാ ഷീറ്റ് ചോദിക്കൂ",pWa:"WhatsApp അന്വേഷണം",menu:"മെനു"}};

Object.assign(T.en,{introEb:"Waterproofing · Tile adhesives · Grouts",introTitle:"BLUTEX Virtual Showroom",introSub:"Explore Construction Chemical Solutions in 3D",enter:"ENTER SHOWROOM",home:"Start"});
Object.assign(T.ml,{introEb:"വാട്ടർപ്രൂഫിംഗ് · ടൈൽ അഡ്ഹെസിവ് · ഗ്രൗട്ട്",introTitle:"BLUTEX വെർച്വൽ ഷോറൂം",introSub:"കൺസ്ട്രക്ഷൻ കെമിക്കൽ സൊല്യൂഷനുകൾ 3D-യിൽ കാണൂ",enter:"ഷോറൂമിൽ കയറൂ"});
T.en.scrollCue=S.en.scrollCue; T.ml.scrollCue=S.ml.scrollCue;

let catFilter="all", stripCat="all";
const img=p=>p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:`<div class="swatch">${["#e8e2d4","#9a9a96","#5b4a3f","#f2c230","#2f4f6f","#8a3b2e"].map(c=>`<i style="background:${c}"></i>`).join("")}</div>`;
const oneLine=p=>t(p.spec.use||p.spec.area)||"";

function renderSite(){
  const s=S[L()];
  $$("#snavLinks").innerHTML=s.nav.map(([k,v])=>`<a href="#${k}" data-go="${k}">${v.toUpperCase()}</a>`).join("");
  $$("#snavMenu").setAttribute("aria-label",s.menu);
  const prods=P.filter(p=>catFilter==="all"||CATS.find(c=>c.id===catFilter).ids.includes(p.id));
  $$("#site").innerHTML=`
  <section class="sec" id="solutions"><div class="sec-in">
    <div class="kick">${s.solK}</div><h2>${s.solH}</h2><div class="rule"></div><p class="lead">${s.solL}</p>
    <div class="sgrid">${CATS.map((c,i)=>`<div class="scard"><div class="n">0${i+1}</div><h3>${t(c.name)}</h3><p>${t(c.d)}</p>
      <div class="sacts"><button type="button" class="sbtn" data-cat-go="${c.id}">${s.view} →</button></div></div>`).join("")}</div>
  </div></section>
  <section class="sec alt" id="products"><div class="sec-in">
    <div class="kick">${s.catK}</div><h2>${s.catH}</h2><div class="rule"></div><p class="lead">${s.catL}</p>
    <div class="pills" role="group">${[["all",s.all],...CATS.filter(c=>c.id!=="tech").map(c=>[c.id,t(c.name)])].map(([id,n])=>`<button type="button" class="pill" data-filter="${id}" aria-pressed="${catFilter===id}">${n}</button>`).join("")}</div>
    <div class="sgrid">${prods.map(p=>`<div class="scard pcard2"><div class="ph">${img(p)}</div><div class="pb">
      <div class="tag">${t((catOf(p.id)||CATS[0]).name)}</div><h3>${esc(p.name)}</h3><p>${esc(oneLine(p))}</p>
      <div class="sacts"><button type="button" class="sbtn pri" data-p3d="${p.id}">${s.in3d}</button><a class="sbtn wa" target="_blank" rel="noopener" href="${waLink(msgProduct(p.name))}">${WA_ICON}${s.inq}</a></div></div></div>`).join("")}</div>
  </div></section>
  <section class="sec" id="gallery"><div class="sec-in">
    <div class="kick">${s.galK}</div><h2>${s.galH}</h2><div class="rule"></div><p class="lead">${s.galL}</p>
    <div class="sgrid">${PROJ.map(pj=>{const mp=P.find(p=>p.id===pj.main);return `<div class="scard pcard2"><div class="ph">${img(mp)}</div><div class="pb">
      <h3>${t(pj.name)}</h3><p>${t(pj.sub)}</p><div class="tag">${esc(mp.name)}</div>
      <div class="sacts"><button type="button" class="sbtn" data-proj="${pj.id}">${s.seeSol} →</button></div></div></div>`;}).join("")}</div>
  </div></section>
  <section class="sec alt" id="why"><div class="sec-in">
    <div class="kick">${s.whyK}</div><h2>${s.whyH}</h2><div class="rule"></div>
    <div class="sgrid">${s.why.map(([h,p],i)=>`<div class="scard"><div class="n">0${i+1}</div><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>
    <div class="trust">${s.trust.map(([b,sp])=>`<div><b>${b}</b><span>${sp}</span></div>`).join("")}</div>
  </div></section>
  <section class="sec" id="support"><div class="sec-in">
    <div class="kick">${s.supK}</div><h2>${s.supH}</h2><div class="rule"></div><p class="lead">${s.supL}</p>
    <div class="sacts"><button type="button" class="sbtn pri" data-cat-go="tech">${s.getRec}</button><a class="sbtn wa" target="_blank" rel="noopener" href="${waLink(msgGeneral())}">${WA_ICON}${s.waUs}</a></div>
  </div></section>
  <section class="sec alt" id="tds"><div class="sec-in">
    <div class="kick">${s.tdsK}</div><h2>${s.tdsH}</h2><div class="rule"></div><p class="lead">${s.tdsL}</p>
    <div class="tds">${P.map(p=>`<div class="tdsrow"><div><b>${esc(p.name)}</b><small>${t((catOf(p.id)||CATS[0]).name)}</small></div>
      ${p.pdf?`<a class="sbtn" href="${p.pdf}" target="_blank" rel="noopener">📄 ${s.open}</a>`:`<a class="sbtn wa" target="_blank" rel="noopener" href="${waLink(msgTds(p.name))}">${WA_ICON}${s.req}</a>`}</div>`).join("")}</div>
  </div></section>
  <section class="sec" id="about"><div class="sec-in">
    <div class="kick">${s.aboutK}</div><h2>${s.aboutH}</h2><div class="rule"></div><p class="lead" style="margin:0">${s.about}</p>
  </div></section>
  <section class="sec alt" id="contact"><div class="sec-in">
    <div class="kick">${s.conK}</div><h2>${s.conH}</h2><div class="rule"></div>
    <div class="contact">
      <a class="scard" href="${waLink(msgGeneral())}" target="_blank" rel="noopener"><span class="n">${s.call}</span><b>+91 94004 39967</b></a>
      <a class="scard" href="mailto:blutexchemicals@gmail.com"><span class="n">${s.mail}</span><b>blutexchemicals@gmail.com</b></a>
      <a class="scard" href="https://instagram.com/blutexchem" target="_blank" rel="noopener"><span class="n">${s.insta}</span><b>@blutexchem</b></a>
      <div class="scard"><span class="n">${s.addr}</span><b>Nellikaparamp, Mukkam, Kerala 673602</b></div>
    </div>
  </div></section>
  <section class="cta"><div class="kick">BLUTEX</div><h2>${s.ctaH}</h2><p class="lead" style="margin:0 auto">${s.ctaS}</p>
    <div class="sacts"><a class="sbtn wa" target="_blank" rel="noopener" href="${waLink(msgGeneral())}">${WA_ICON}${s.waUs}</a><a class="sbtn" href="#products" data-go="products">${s.explore}</a></div></section>

/* navigation */
const intro=$$("#intro"), snav=$$("#snav");
function enterThen(fn){ if(!entered){ $$("#enter").click(); setTimeout(fn,4200); } else fn(); }
function go(k){ snav.classList.remove("open"); $$("#snavMenu").setAttribute("aria-expanded","false");
  if(k==="showroom"){ enterThen(()=>{}); return; }
  const el=k==="home"?$$("#home"):document.getElementById(k); if(el) intro.scrollTo({top:k==="home"?0:el.getBoundingClientRect().top+intro.scrollTop-58,behavior:"smooth"}); }
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g&&intro.contains(g)){ e.preventDefault(); go(g.dataset.go); return; }
  const f=e.target.closest("[data-filter]"); if(f){ catFilter=f.dataset.filter; renderSite(); return; }
  const p3=e.target.closest("[data-p3d]"); if(p3){ const id=p3.dataset.p3d; enterThen(()=>goProduct(id)); return; }
  const pr=e.target.closest("[data-proj]"); if(pr){ const id=pr.dataset.proj; enterThen(()=>goProject(id)); return; }
  const cg=e.target.closest("[data-cat-go]"); if(cg){ const c=cg.dataset.catGo; enterThen(()=>openCat(c)); return; }
});
$$("#snavMenu").addEventListener("click",()=>{ const o=!snav.classList.contains("open"); snav.classList.toggle("open",o); $$("#snavMenu").setAttribute("aria-expanded",o); });
intro.addEventListener("scroll",()=>snav.classList.toggle("solid",intro.scrollTop>40),{passive:true});
window.__introScrolled=()=>!intro.hidden&&intro.scrollTop>innerHeight*.9;

/* back to the site from inside the showroom */
const menuBtn=document.createElement("button"); menuBtn.type="button"; menuBtn.className="icon"; menuBtn.id="siteBtn"; menuBtn.textContent="☰"; menuBtn.setAttribute("aria-label","Menu");
$$("#top .tb").appendChild(menuBtn);
menuBtn.addEventListener("click",()=>{ try{stopAll();}catch(e){} for(const k in STAFF) STAFF[k].talkUntil=0;
  current=null; try{currentProject=null;}catch(e){} $$("#sheet").classList.remove("open"); $$("#bubble").classList.add("off");
  ["#top","#strip","#hint","#projbtn"].forEach(s=>{const el=$$(s); if(el) el.hidden=true;});
  entered=false; tween=null; document.body.classList.remove("in-showroom");
  intro.hidden=false; intro.scrollTop=0; requestAnimationFrame(()=>{ intro.style.opacity=1; }); try{resize();}catch(e){} });
$$("#enter").addEventListener("click",()=>document.body.classList.add("in-showroom"));

/* showroom categories */
function openCat(c){
  if(c==="tech"){ stripCat="all"; buildStrip(); try{ currentProject=null; projPanel("pick"); }catch(e){} return; }
  stripCat=c; buildStrip(); const cat=CATS.find(x=>x.id===c), id=cat&&cat.ids[0]; if(!id) return;
  current=null; $$("#sheet").classList.remove("open"); const s=STOPS[id];
  flyTo(s.cam,lookYP(s.cam,s.target.clone().add(new THREE.Vector3(0,-.1,0))));
  Object.assign(STAFF.arun,{target:s.man.clone(),pointAt:s.target.clone(),face:null});
}
buildStrip=function(){
  const tabs=[["all",S[L()].all],...CATS.map(c=>[c.id,t(c.name)])];
  const list=P.filter(p=>stripCat==="all"||(CATS.find(c=>c.id===stripCat)||{ids:[]}).ids.includes(p.id));
  $$("#strip").innerHTML=`<div class="ctabs" role="group">${tabs.map(([id,n])=>`<button type="button" class="ctab" data-scat="${id}" aria-pressed="${stripCat===id}">${n}</button>`).join("")}</div>
   <div class="chips">${list.map(p=>`<button type="button" class="chip ${p.cat} ${p.id===current?"on":""}" data-pid="${p.id}"><small>${t((catOf(p.id)||CATS[0]).name)}</small><span>${p.short||p.name}</span></button>`).join("")}</div>`;
};
$$("#strip").addEventListener("click",e=>{ const b=e.target.closest("[data-scat]"); if(!b) return; const c=b.dataset.scat;
  if(c==="all"){ stripCat="all"; buildStrip(); } else openCat(c); });

/* product information panel: only the facts already stored for each product */
showSheet=function(id,open=true){
  const p=P.find(x=>x.id===id), s=S[L()], Lb=T[lang], sp=p.spec, cat=catOf(id)||CATS[0];
  const block=(h,v)=>v?`<div class="iblock"><h4>${h}</h4><p>${esc(t(v))}</p></div>`:"";
  const apps=[t(sp.use||sp.area),sp.surf?((K.surf[L()])+": "+t(sp.surf)):""].filter(Boolean).join(". ");
  const used=new Set(["use","area","surf","feat","pack","cover","coats"]);
  const rows=Object.entries(sp).filter(([k])=>!used.has(k)&&K[k]).map(([k,v])=>`<tr><th>${K[k][L()]}</th><td>${esc(t(v))}</td></tr>`).join("");
  $$("#sh").innerHTML=`
   <div class="sh-top"><div><div class="cat" style="color:${p.cat==="wp"?"#6fc1ff":"var(--gold)"}">${t(cat.name)}</div><h2 id="pname">${esc(p.name)}</h2></div>
    <button type="button" class="x" id="close" aria-label="Close">✕</button></div>
   ${p.img?`<img class="pimg" src="${p.img}" alt="${esc(p.name)}">`:`<div style="justify-self:center">${img(p)}</div>`}
   <p class="desc">${esc(p[lang])}</p>
   <div class="acts">
     ${p.pdf?`<a class="btn" href="${p.pdf}" target="_blank" rel="noopener">📄 ${s.pTds}</a>`:`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(msgTds(p.name))}">📄 ${s.pReqTds}</a>`}
     <a class="btn wa" target="_blank" rel="noopener" href="${waLink(msgProduct(p.name))}">${WA_ICON} ${s.pWa}</a>
     <button type="button" class="btn" id="listen">▶ ${Lb.listen}</button>
   </div>
   <div class="ipanel">
     ${block(s.pApps,apps)}${block(s.pBen,sp.feat)}${block(s.pPack,sp.pack)}${block(s.pCov,sp.cover)}${block(s.pMeth,sp.coats)}
     ${rows?`<div class="iblock"><h4>${s.pTech}</h4><table>${rows}</table></div>`:""}
   </div>`;
  $$("#close").onclick=()=>goHome();
  $$("#listen").onclick=()=>speak(p[lang],p.id,whoFor(p.id));
  if(open) $$("#sheet").classList.add("open");
  updateFab();
};

/* floating WhatsApp: mentions the product being viewed */
const fab=$$("#waFab");
function updateFab(){ const p=(typeof current!=="undefined"&&current)?P.find(x=>x.id===current):null; fab.href=waLink(p?msgProduct(p.name):msgGeneral()); }
fab.addEventListener("click",()=>{ updateFab(); try{ if(typeof gcEvent==="function") gcEvent("whatsapp-fab","Floating WhatsApp"); }catch(e){} },true);

const _al=applyLang; applyLang=function(){ _al(); renderSite(); };
applyLang();
})();
