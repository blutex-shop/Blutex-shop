<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Walk into the Blutex showroom in 3D: tile adhesives, epoxy grout and waterproofing products with data sheets.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Blutex Virtual Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<style>
/* Layout: full-screen 3D shop; storefront photo intro; top bar (language, home); salesman speech bubble; bottom product strip + slide-up product sheet */
:root{
  --navy:#0b1f4b; --navy-d:#061330; --panel:rgba(6,19,48,.94); --line:#24427a;
  --blue:#1e90ff; --gold:#f5a623; --ink:#ffffff; --mute:#a7b8d6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Noto Sans Malayalam",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--navy-d);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
body.ml{--body:"Noto Sans Malayalam","Barlow",system-ui,sans-serif}
#app{position:fixed;inset:0}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 60%,rgba(0,0,0,.28) 100%)}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* intro */
#intro{position:fixed;inset:0;z-index:20;background:transparent;display:flex;flex-direction:column;justify-content:flex-end}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,19,48,0) 0%,rgba(6,19,48,0) 52%,rgba(6,19,48,.96) 82%)}
.intro-in{position:relative;padding:24px 16px calc(28px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;width:100%;display:grid;gap:14px;text-align:center}
.intro-in .eb{font-family:var(--display);letter-spacing:.2em;color:var(--gold);font-size:14px;text-transform:uppercase}
.intro-in h1{font-family:var(--display);font-size:clamp(34px,9vw,52px);margin:0;line-height:1}
.intro-in p{margin:0;color:var(--mute)}
.lang{display:flex;justify-content:center;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:max-content;margin:0 auto;background:rgba(6,19,48,.6)}
.lang button{background:transparent;border:0;padding:8px 18px;font-size:15px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}
.enter{background:var(--blue);border:0;border-radius:14px;padding:16px;font-weight:600;font-size:18px;color:#fff;box-shadow:0 8px 24px rgba(30,144,255,.35)}
.loading{font-size:13px;color:var(--mute);min-height:1.2em}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(180deg,rgba(6,19,48,.85),transparent)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em}
.brand span{color:var(--blue)}
.tb{display:flex;gap:8px;align-items:center}
.icon{background:rgba(6,19,48,.7);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:14px;white-space:nowrap}
[hidden]{display:none!important}
#top .lang button{padding:7px 11px;font-size:14px}
@media (max-width:460px){#top .brand{font-size:18px}.tb{gap:5px}.icon{padding:6px 9px;font-size:13px}#top .lang button{padding:6px 9px;font-size:13px}}
@media (max-width:380px){#top .brand{display:none}}

/* speech bubble */
#bubble{position:fixed;z-index:6;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top,0px));max-width:520px;margin:0 auto;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;
  transition:opacity .3s,transform .3s}
#bubble.off{opacity:0;transform:translateY(-8px);pointer-events:none}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(160deg,#2a5bd7,#0b1f4b);display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:18px;border:2px solid var(--blue)}
.bt{min-width:0}
.bt b{font-size:13px;color:var(--gold);display:block}
.bt p{margin:2px 0 0;font-size:15px;line-height:1.45}
.vnote{font-size:12px;color:var(--mute);margin-top:4px}

/* hint */
#hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:rgba(6,19,48,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mute);white-space:nowrap;transition:opacity .4s}

/* product strip */
#strip{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(6,19,48,.95) 60%,transparent);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:rgba(11,31,75,.9);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:118px;text-align:left}
.chip small{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.chip span{font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{border-color:var(--blue);background:#123274}
.chip.wp small{color:#6fc1ff}.chip.ta small{color:var(--gold)}

/* product sheet */
#sheet{position:fixed;z-index:7;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh{max-width:620px;margin:0 auto;display:grid;gap:12px}
.sh-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.sh h2{font-family:var(--display);font-size:32px;margin:2px 0 0;line-height:1}
.x{background:transparent;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;flex:none;font-size:18px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;border-radius:6px;padding:3px 8px;background:#0e4a5c}
.badge.sample{background:#5a3b06;color:#ffd38a}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font-family:var(--display);font-size:34px;color:var(--gold)}
.price span{font-size:13px;color:var(--mute)}
.pimg{width:min(46%,200px);height:auto;border-radius:10px;justify-self:center}
.desc{margin:0;line-height:1.55;font-size:15px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#123274;border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink)}
.btn.wa{background:#1f9d55;border-color:#1f9d55}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;width:40%;padding-right:10px}
.dsh{font-family:var(--display);font-size:20px;margin:6px 0 0;letter-spacing:.04em}
@media (min-width:900px){#sheet{left:auto;right:16px;bottom:16px;width:420px;max-height:calc(100% - 120px);border-radius:20px;border:1px solid var(--line)}#strip{justify-content:center}}
@media (prefers-reduced-motion:reduce){#sheet,#bubble{transition:none}}
</style>

</head>

<div id="app"><canvas id="c"></canvas></div>

<div id="intro">

    <h1 data-t="introTitle"></h1>

    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="ml" aria-pressed="false">മലയാളം</button>

  </div>
</div>

<div id="bubble" class="off" aria-live="polite">
  <div class="av" id="av">A</div>
  <div class="bt"><b id="who"></b><p id="say"></p><div class="vnote" id="vnote" hidden></div></div>

<div id="hint" hidden data-t="hint"></div>
<nav id="strip" hidden aria-label="Products"></nav>

<div id="sheet" role="dialog" aria-modal="false" aria-labelledby="pname">
  <div class="grab"></div>

</div>

const player=new Audio(); player.preload="auto";
function setSpeaker(w){ const n=T[lang][w==="anjali"?"anjaliName":"arunName"]; const who=document.getElementById("who"); if(who) who.textContent=n;
  const av=document.getElementById("av"); av.textContent=w==="anjali"?"A":"A"; av.style.borderColor=w==="anjali"?"#2ec4b6":"var(--blue)"; av.style.background=w==="anjali"?"linear-gradient(160deg,#14a3b8,#0b1f4b)":"";
  av.textContent=n.trim()[0]; }
function stopAll(){ try{player.pause();}catch(e){} try{speechSynthesis.cancel();}catch(e){} }
let speaker="arun";
function speak(text,key,who="arun",then){
  speaker=who; setSpeaker(who);
  const sayEl=$("#say"); $("#bubble").classList.remove("off");
  clearInterval(typeTimer); let i=0; sayEl.textContent="";
  const chars=[...text];
  typeTimer=setInterval(()=>{ i+=2; sayEl.textContent=chars.slice(0,i).join(""); if(i>=chars.length) clearInterval(typeTimer); },28);
  for(const k in STAFF) STAFF[k].talkUntil=0;
  STAFF[who].talkUntil=performance.now()+Math.min(14000,chars.length*55);
  const vn=$("#vnote"); vn.hidden=true;
  stopAll();
  const rec=key&&VOICE[key]&&VOICE[key][lang];
  if(rec&&soundOn){
    player.src=rec; player.currentTime=0;
    player.onloadedmetadata=()=>{ STAFF[who].talkUntil=performance.now()+player.duration*1000; };
    player.onended=()=>{ STAFF[who].talkUntil=0; if(then&&speaker===who) then(); };
    STAFF[who].talkUntil=performance.now()+27000;
    player.play().catch(()=>{});
    return;
  }
  if(!soundOn||!("speechSynthesis" in window)){ if(then) setTimeout(()=>{if(speaker===who) then();},Math.min(14000,chars.length*55)+600); return; }
  try{
    speechSynthesis.cancel();
    const want=lang==="ml"?"ml":"en-IN";
    let v=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(want.toLowerCase()));
    if(!v&&lang==="en") v=voices.find(v=>v.lang&&v.lang.startsWith("en"));
    if(!v&&lang==="ml"){ vn.textContent=T.ml.noVoice; vn.hidden=false; if(then) setTimeout(()=>{if(speaker===who) then();},Math.min(14000,chars.length*55)+600); return; }
    const u=new SpeechSynthesisUtterance(text); if(v){u.voice=v;u.lang=v.lang;} else u.lang=want; u.rate=lang==="ml"?.95:1; u.pitch=.95;
    if(false){ const fv=voices.find(x=>x.lang&&x.lang.startsWith(lang==="ml"?"ml":"en")&&/female|woman|veena|lekha|heera|priya|neerja|zira|samantha|karen/i.test(x.name)); if(fv){u.voice=fv;u.lang=fv.lang;} }
    u.onend=()=>{ STAFF[who].talkUntil=0; if(then&&speaker===who) then(); };
    speechSynthesis.speak(u);
  }catch(e){}
}
$("#sound").addEventListener("click",e=>{ soundOn=!soundOn; e.currentTarget.textContent=soundOn?"🔊":"🔇"; e.currentTarget.setAttribute("aria-pressed",soundOn); if(!soundOn){ stopAll(); for(const k in STAFF) STAFF[k].talkUntil=0; } });

function updateExterior(dt){
  const near=camera.position.z>-2.6&&camera.position.z<6.5;
  doorOpen+=((near?1:0)-doorOpen)*Math.min(1,dt*2.2);
  DOORS.forEach(d=>d.rotation.y=d.userData.sd*doorOpen*1.25);
  CARS.forEach(c=>{c.x+=c.v*dt; if(c.x>26)c.x=-26; if(c.x<-26)c.x=26; c.g.position.x=c.x;});
}

    const cap=add(new THREE.Mesh(new THREE.SphereGeometry(.116,32,20,0,Math.PI*2,0,Math.PI*.5),hair),0,.03,-.006,head); cap.scale.set(.97,1.05,1.04);
    const fr=add(new THREE.Mesh(new THREE.BoxGeometry(.15,.03,.05),hair),0,.1,.07,head); fr.rotation.x=-.5;
    add(new THREE.Mesh(new THREE.BoxGeometry(.05,.01,.008),hair),0,-.036,.104,head);   // moustache
  }
  // arms: shoulder → upper arm (sleeve) → elbow → forearm → hand
  function arm(sd){
    const sh=new THREE.Group(); sh.position.set(sd*(fem?.162:.188),fem?1.39:1.44,0); sh.rotation.order="YXZ"; g.add(sh);
    add(new THREE.Mesh(new THREE.SphereGeometry(fem?.047:.056,16,12),shirt),0,0,0,sh);
    add(new THREE.Mesh(new THREE.CylinderGeometry(fem?.047:.056,fem?.045:.054,.15,16),shirt),0,-.075,0,sh);
    add(new THREE.Mesh(new THREE.CylinderGeometry(fem?.036:.043,fem?.032:.038,.16,14),skin),0,-.2,0,sh);
    const el=new THREE.Group(); el.position.y=-.28; sh.add(el);
    add(new THREE.Mesh(new THREE.SphereGeometry(fem?.032:.038,12,10),skin),0,0,0,el);
    add(new THREE.Mesh(new THREE.CylinderGeometry(fem?.031:.036,fem?.025:.029,.24,14),skin),0,-.12,0,el);
    const hd=add(new THREE.Mesh(new THREE.SphereGeometry(fem?.034:.04,12,10),skin),0,-.27,.005,el); hd.scale.set(.75,1.25,.5);
    return {sh,el};
  }
  const aL=arm(-1), aR=arm(1); P2.armL=aL.sh; P2.elbowL=aL.el; P2.armR=aR.sh; P2.elbowR=aR.el;
  // legs: hip → thigh → knee → shin → shoe
  function leg(sd){
    const hp=new THREE.Group(); hp.position.set(sd*(fem?.075:.085),.88,0); g.add(hp);
    add(new THREE.Mesh(new THREE.CylinderGeometry(fem?.068:.078,fem?.055:.062,.43,16),pants),0,-.215,0,hp);
    const kn=new THREE.Group(); kn.position.y=-.43; hp.add(kn);
    add(new THREE.Mesh(new THREE.CylinderGeometry(fem?.052:.06,fem?.044:.05,.41,16),pants),0,-.205,0,kn);
    const sh=add(new THREE.Mesh(new THREE.BoxGeometry(fem?.085:.1,.07,fem?.21:.25),shoe),0,-.43,.045,kn); sh.geometry.translate(0,0,0);
    return {hp,kn};
  }
  const lL=leg(-1), lR=leg(1); P2.legL=lL.hp; P2.kneeL=lL.kn; P2.legR=lR.hp; P2.kneeR=lR.kn;
  g.position.copy(f.start);
  return {g,parts:P2,home:f.home.clone(),target:f.home.clone(),face:null,pointAt:null,talkUntil:0,phase:f.phase||0,blinkAt:2+Math.random()*3};
}
const GOLD_S=new THREE.MeshStandardMaterial({color:0xd4a64a,metalness:1,roughness:.3});
const arun=makePerson({skin:0xa8714a,pants:0x2f4f86,shoe:0xf2f2f2,start:new THREE.Vector3(1.25,0,-5.3),home:new THREE.Vector3(.35,0,-3.8)});
const anjali=makePerson({female:true,skin:0xb98058,pants:0x1c2238,shoe:0x6b4a3a,start:new THREE.Vector3(-1.7,0,-5.5),home:new THREE.Vector3(-.72,0,-4.0),phase:1.7});
scene.remove(anjali.g);
const STAFF={arun};
const whoFor=()=>"arun";


/* ---------------- Fayez 3D avatar (FBX, procedural animation) ---------------- */
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_q1=new THREE.Quaternion(),_q2=new THREE.Quaternion(),_q3=new THREE.Quaternion();
function aimBone(bone,child,dirW){
  _v1.setFromMatrixPosition(bone.matrixWorld); _v2.setFromMatrixPosition(child.matrixWorld);
  const cur=_v2.sub(_v1).normalize(); _q1.setFromUnitVectors(cur,dirW);
  bone.getWorldQuaternion(_q2); bone.parent.getWorldQuaternion(_q3);
  bone.quaternion.copy(_q3.invert().multiply(_q1.multiply(_q2))); bone.updateMatrixWorld(true);
}
function turnBone(bone,axisW,ang){ bone.getWorldQuaternion(_q2); _q1.setFromAxisAngle(axisW,ang); bone.parent.getWorldQuaternion(_q3);
  bone.quaternion.copy(_q3.invert().multiply(_q1.multiply(_q2))); bone.updateMatrixWorld(true); }
function loadFayez(){
  if(!THREE.FBXLoader||typeof fflate==="undefined") return;
  Promise.all(["fayez_part00.txt","fayez_part01.txt"].map(u=>fetch(u).then(r=>{if(!r.ok) throw 0; return r.text();}))).then(parts=>{
    const bin=atob(parts.join("").replace(/\s/g,"")); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const raw=fflate.gunzipSync(u8);
    onFbx(new THREE.FBXLoader().parse(raw.buffer.slice(raw.byteOffset,raw.byteOffset+raw.byteLength),""));
  }).catch(()=>{});

// Remove the ponytail and keep a short, neat haircut close to the scalp.
function trimHair(hair,head,K){
  const pa=hair.geometry.attributes.position, hb=head.geometry.attributes.position;
  const hbx=new THREE.Box3().setFromBufferAttribute(hb);
  const top=hbx.max.y, c=new THREE.Vector3((hbx.min.x+hbx.max.x)/2, top-0.115, (hbx.min.z+hbx.max.z)/2-0.01);
  const N=64,M=32,bins=new Float32Array(N*M),v=new THREE.Vector3();
  const idx=(x,y,z,r)=>{const th=Math.atan2(x,z),ph=Math.acos(Math.max(-1,Math.min(1,y/r)));
    const i=Math.min(N-1,Math.floor((th+Math.PI)/(2*Math.PI)*N)),j=Math.min(M-1,Math.floor(ph/Math.PI*M));return j*N+i;};
  for(let i=0;i<hb.count;i++){v.fromBufferAttribute(hb,i).sub(c);const r=v.length();const k=idx(v.x,v.y,v.z,r);if(r>bins[k])bins[k]=r;}
  // fill empty bins from neighbours
  for(let pass=0;pass<4;pass++)for(let j=0;j<M;j++)for(let i=0;i<N;i++){const k=j*N+i;if(bins[k])continue;let s=0,n=0;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([di,dj])=>{const ii=(i+di+N)%N,jj=j+dj;if(jj<0||jj>=M)return;const q=bins[jj*N+ii];if(q){s+=q;n++;}});if(n)bins[k]=s/n;}
  const nape=c.y-0.075;
  for(let i=0;i<pa.count;i++){v.fromBufferAttribute(pa,i).sub(c);let r=v.length();if(r<1e-5)continue;
    if(v.z<0.02){ // back half: cap thickness, lift anything below the nape
      if(v.y+c.y<nape){ v.y=(nape-c.y)-(nape-c.y-v.y)*0.04; r=v.length(); }
      const s=bins[idx(v.x,v.y,v.z,r)]||r; const maxR=s+0.011*K; if(r>maxR) v.multiplyScalar(maxR/r);
    }
    v.add(c); pa.setXYZ(i,v.x,v.y,v.z);}
  pa.needsUpdate=true; hair.geometry.computeVertexNormals(); hair.geometry.computeBoundingSphere();
};

  function onFbx(fbx){
    const B={}, morphMeshes=[], shirt=tex("outfit_white.jpg"); shirt.flipY=true;
    fbx.traverse(n=>{
      if(n.isBone&&!B[n.name]) B[n.name]=n;
      if(n.isMesh){ n.frustumCulled=false;
        const ms=Array.isArray(n.material)?n.material:[n.material];
        ms.forEach(m=>{ if(m.map) m.map.encoding=THREE.sRGBEncoding; if(m.shininess!==undefined){m.shininess=8; if(m.specular) m.specular.setHex(0x111111);} });
        n.castShadow=true;
        if(n.name==="outfit"){ const om=n.material; om.map=shirt; om.needsUpdate=true; }
        if(n.morphTargetDictionary) morphMeshes.push(n); }
    });
    { let hm=null,hd=null; fbx.traverse(n=>{ if(n.isMesh&&n.name==="haircut") hm=n; if(n.isMesh&&n.name==="AvatarHead") hd=n; });
      if(hm&&hd) try{ trimHair(hm,hd,0.9); }catch(e){} }
    const need=["Hips","Spine2","Neck","Head","LeftArm","LeftForeArm","LeftHand","RightArm","RightForeArm","RightHand","LeftUpLeg","LeftLeg","LeftFoot","RightUpLeg","RightLeg","RightFoot"];
    if(need.some(n=>!B[n])) return;
    const wrap=new THREE.Group(); wrap.add(fbx); scene.add(wrap);
    wrap.position.copy(arun.g.position); wrap.rotation.y=arun.g.rotation.y; fbx.updateMatrixWorld(true);
    // BLUTEX logo on the left chest, attached to the chest bone
    let best=null; fbx.traverse(n=>{ if(n.name==="outfit"&&n.isMesh){ const pa=n.geometry.attributes.position, v=new THREE.Vector3();
      for(let i=0;i<pa.count;i+=1){ v.fromBufferAttribute(pa,i).applyMatrix4(n.matrixWorld); if(Math.abs(v.x-.085)<.03&&Math.abs(v.y-1.33)<.03&&(!best||v.z>best.z)) best=v.clone(); } } });
    if(best){ const lt=tex("blutex_logo_dark.png");
      const lg=new THREE.Mesh(new THREE.PlaneGeometry(.12,.046),new THREE.MeshBasicMaterial({map:lt,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
      lg.position.copy(fbx.worldToLocal(best.clone().add(new THREE.Vector3(0,0,.006)))); fbx.add(lg); fbx.updateMatrixWorld(true); B.Spine2.attach(lg); }
    const rest={}; need.forEach(n=>rest[n]=B[n].quaternion.clone());
    const mIdx=morphMeshes.map(m=>m.morphTargetDictionary);
    scene.remove(arun.g); arun.g=wrap;
    arun.rig={B,rest,morphMeshes,mIdx};
  }
}
function setMorph(R,name,val){ R.morphMeshes.forEach((m,i)=>{ const k=R.mIdx[i][name]; if(k!==undefined) m.morphTargetInfluences[k]=val; }); }
function animateRig(S,t,walking,ph,talking){
  const R=S.rig, B=R.B, g=S.g;
  for(const n in R.rest) B[n].quaternion.copy(R.rest[n]);
  g.updateMatrixWorld(true);
  const gq=g.getWorldQuaternion(new THREE.Quaternion());
  const D=(x,y,z)=>new THREE.Vector3(x,y,z).normalize().applyQuaternion(gq);
  const sw=walking?Math.sin(ph):0, br=Math.sin(t*1.7);
  // legs
  if(walking){
    const kL=Math.max(0,Math.sin(ph+Math.PI*.5))*.75, kR=Math.max(0,Math.sin(ph-Math.PI*.5))*.75;
    aimBone(B.LeftUpLeg,B.LeftLeg,D(0,-1,sw*.45)); aimBone(B.LeftLeg,B.LeftFoot,D(0,-1,sw*.45-kL));
    aimBone(B.RightUpLeg,B.RightLeg,D(0,-1,-sw*.45)); aimBone(B.RightLeg,B.RightFoot,D(0,-1,-sw*.45-kR));
  } else {
    aimBone(B.LeftUpLeg,B.LeftLeg,D(.02,-1,0)); aimBone(B.RightUpLeg,B.RightLeg,D(-.02,-1,0));
  }
  // right arm: point at product, swing, or relax
  if(!walking&&S.pointAt){
    _v1.setFromMatrixPosition(B.RightArm.matrixWorld);
    const dir=S.pointAt.clone().sub(_v1).normalize(); dir.y=Math.max(dir.y,-.15); dir.normalize();
    aimBone(B.RightArm,B.RightForeArm,dir); aimBone(B.RightForeArm,B.RightHand,dir.clone().add(new THREE.Vector3(0,.05,0)).normalize());
  } else if(walking){ aimBone(B.RightArm,B.RightForeArm,D(-.1,-1,sw*.45)); aimBone(B.RightForeArm,B.RightHand,D(-.05,-1,sw*.45+.3)); }
  else { aimBone(B.RightArm,B.RightForeArm,D(-.13,-1,.02+br*.01)); aimBone(B.RightForeArm,B.RightHand,D(-.06,-1,.2)); }
  // left arm: talk gesture, swing, or relax
  if(walking){ aimBone(B.LeftArm,B.LeftForeArm,D(.1,-1,-sw*.45)); aimBone(B.LeftForeArm,B.LeftHand,D(.05,-1,-sw*.45+.3)); }
  else if(talking){ aimBone(B.LeftArm,B.LeftForeArm,D(.2,-1,.32+Math.sin(t*2.6)*.08)); aimBone(B.LeftForeArm,B.LeftHand,D(.18+Math.sin(t*3.4)*.12,-.25,1)); }
  else { aimBone(B.LeftArm,B.LeftForeArm,D(.13,-1,.02+br*.01)); aimBone(B.LeftForeArm,B.LeftHand,D(.06,-1,.2)); }
  // head + breathing
  const up=new THREE.Vector3(0,1,0);
  turnBone(B.Spine2,D(1,0,0),br*.012);
  if(!walking&&!S.pointAt) turnBone(B.Head,up,Math.sin(t*.45)*.15);
  if(talking) turnBone(B.Head,D(1,0,0),Math.sin(t*5.2)*.03);
  // face: lip-sync, blink, friendly smile
  const open=talking?Math.max(0,Math.sin(t*11)*.5+Math.sin(t*17)*.25):0;
  setMorph(R,"jawOpen",open*.45); setMorph(R,"aa",open*.5); setMorph(R,"oh",talking?Math.max(0,Math.sin(t*7))*.25:0);
  setMorph(R,"mouthSmileLeft",.22); setMorph(R,"mouthSmileRight",.22);
  if(t>S.blinkAt){ S.blinkAt=t+2.5+Math.random()*3.5; S.blinkEnd=t+.13; }
  const bl=t<(S.blinkEnd||0)?1:0; setMorph(R,"eyeBlinkLeft",bl); setMorph(R,"eyeBlinkRight",bl);
}

/* ---------------- camera control ---------------- */
let yaw=0,pitch=0,tween=null;
camera.position.set(0,1.6,4);
function lookYP(from,to){const d=to.clone().sub(from);return{y:Math.atan2(-d.x,-d.z),p:Math.atan2(d.y,Math.hypot(d.x,d.z))};}
function flyTo(pos,yp,dur=1600){ tween={t0:performance.now(),dur,fp:camera.position.clone(),tp:pos.clone(),fy:yaw,ty:yaw+angDiff(yaw,yp.y),fpi:pitch,tpi:yp.p}; }
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

let down=null;
canvas.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,yaw,pitch,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove",e=>{ if(!down||tween) return; const dx=e.clientX-down.x,dy=e.clientY-down.y; if(Math.hypot(dx,dy)>6) down.moved=true;
  yaw=down.yaw+dx*.005; pitch=Math.max(-.7,Math.min(.6,down.pitch+dy*.004)); $("#hint").style.opacity=0; });
canvas.addEventListener("pointerup",e=>{ if(down&&!down.moved) pick(e); down=null; });
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(e){ if(!entered) return; const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera); const hit=ray.intersectObjects(pickables,false)[0]; if(hit&&hit.object.userData.pid) goProduct(hit.object.userData.pid); }

function goProduct(id){
  current=id; const s=STOPS[id];
  flyTo(s.cam,lookYP(s.cam,s.target.clone().add(new THREE.Vector3(0,-.1,0))));
  const who=whoFor(id);
  Object.assign(STAFF[who],{target:s.man.clone(),pointAt:s.target.clone(),face:null});
  buildStrip(); showSheet(id);
  setTimeout(()=>speak(P.find(p=>p.id===id)[lang],id,who),700);
  $("#hint").style.opacity=0;
}
function goHome(){
  current=null; $("#sheet").classList.remove("open"); buildStrip();
  const pos=new THREE.Vector3(0,1.6,-1.0); flyTo(pos,{y:0,p:-.1});
  for(const k in STAFF) Object.assign(STAFF[k],{target:STAFF[k].home.clone(),pointAt:null,face:null});
  speak(T[lang].homeSay,"home","arun");
}

/* ---------------- loop ---------------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(tween){ const k=Math.min(1,(now-tween.t0)/tween.dur), e=ease(k);
    camera.position.lerpVectors(tween.fp,tween.tp,e); yaw=tween.fy+(tween.ty-tween.fy)*e; pitch=tween.fpi+(tween.tpi-tween.fpi)*e; if(k>=1) tween=null; }
  const t=now/1000;
  if(!entered&&!tween){ const a=t*.09, nar=innerWidth<innerHeight; camera.position.set(Math.sin(a)*(nar?1.4:2.4),1.5,(nar?13.2:11)+Math.cos(a*1.3)*.4); const yp=lookYP(camera.position,new THREE.Vector3(0,2.15,0)); yaw=yp.y; pitch=yp.p; }
  camera.rotation.set(pitch,yaw,0);
  updateExterior(dt);
  for(const k in STAFF){ const S=STAFF[k], g=S.g, P2=S.parts;
    const to=S.target.clone().sub(g.position); to.y=0; const dist=to.length(), walking=dist>.05;
    if(S.rig){
      if(walking){ g.position.add(to.normalize().multiplyScalar(Math.min(dist,1.25*dt))); g.rotation.y+=angDiff(g.rotation.y,Math.atan2(to.x,to.z))*Math.min(1,dt*7); }
      else { const f=S.pointAt?camera.position.clone().lerp(S.pointAt,.35):(S.face||camera.position); const d=f.clone().sub(g.position); g.rotation.y+=angDiff(g.rotation.y,Math.atan2(d.x,d.z))*Math.min(1,dt*3.5); }
      const ph=t*7.5+S.phase; g.position.y=walking?Math.abs(Math.sin(ph))*.015:0;
      animateRig(S,t,walking,ph,now<S.talkUntil); continue;
    }
    if(walking){ g.position.add(to.normalize().multiplyScalar(Math.min(dist,1.25*dt))); g.rotation.y+=angDiff(g.rotation.y,Math.atan2(to.x,to.z))*Math.min(1,dt*7); }
    else { const f=S.pointAt?camera.position.clone().lerp(S.pointAt,.35):(S.face||camera.position); const d=f.clone().sub(g.position); g.rotation.y+=angDiff(g.rotation.y,Math.atan2(d.x,d.z))*Math.min(1,dt*3.5); }
    const ph=t*7.5+S.phase, sw=walking?Math.sin(ph):0;
    P2.legL.rotation.x=-sw*.45; P2.legR.rotation.x=sw*.45;
    P2.kneeL.rotation.x=walking?Math.max(0,Math.sin(ph+Math.PI*.5))*.7:0;
    P2.kneeR.rotation.x=walking?Math.max(0,Math.sin(ph-Math.PI*.5))*.7:0;
    const talking=now<S.talkUntil, br=Math.sin(t*1.7+S.phase);
    P2.chest.scale.set(1,1+br*.006,.64*(1+br*.018));
    if(!walking&&S.pointAt){ const local=g.worldToLocal(S.pointAt.clone()); const ang=Math.atan2(local.x,local.z);
      P2.armR.rotation.set(-1.15+Math.sin(t*1.6)*.04,Math.max(-1.1,Math.min(1.1,ang))*.85,-.05); P2.elbowR.rotation.x=-.18; }
    else { P2.armR.rotation.set(walking?sw*.5:Math.sin(t*1.2+S.phase)*.03,0,-.07); P2.elbowR.rotation.x=walking?-.35:-.14; }
    if(walking){ P2.armL.rotation.set(-sw*.5,0,.07); P2.elbowL.rotation.x=-.35; }
    else if(talking){ P2.armL.rotation.set(-.42+Math.sin(t*3.1)*.12,0,.16); P2.elbowL.rotation.x=-1.0+Math.sin(t*4.3)*.22; }
    else { P2.armL.rotation.set(Math.sin(t*1.1+S.phase)*.03,0,.07); P2.elbowL.rotation.x=-.14; }
    P2.head.rotation.x=talking?Math.sin(t*5.5)*.035:Math.sin(t*.7+S.phase)*.02;
    P2.head.rotation.y=(!walking&&!S.pointAt)?Math.sin(t*.45+S.phase)*.18:0;
    P2.mouth.scale.y=talking?1+Math.abs(Math.sin(t*13))*2.6:1;
    if(t>S.blinkAt){ S.blinkAt=t+2.5+Math.random()*3.5; S.blinkEnd=t+.13; }
    const bl=t<(S.blinkEnd||0)?.12:1; P2.eyes.forEach(e=>e.scale.y=bl);
    if(P2.pony) P2.pony.rotation.z=walking?Math.sin(ph*2)*.12:Math.sin(t*1.3)*.03;
    g.position.y=walking?Math.abs(Math.sin(ph))*.018:0;
  }

  pins.forEach((p,i)=>{p.visible=entered&&camera.position.z<0; p.position.y=p.userData.baseY+Math.sin(t*2+i)*.05;});
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

  setTimeout(()=>{ flyTo(new THREE.Vector3(.98,1.6,-1.0),{y:0,p:-.06},1700); },1850);
  setTimeout(()=>{ flyTo(new THREE.Vector3(0,1.6,-1.0),{y:0,p:-.1},1000); speak(T[lang].greet,"greet","arun"); },3600);
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance("")); }catch(e){}
